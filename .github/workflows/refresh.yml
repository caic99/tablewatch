name: refresh

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC): 08:00 / 14:00 / 20:00 / 02:00 Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture a new availability snapshot
        run: python3 rw-data/scrape.py
      - name: Rebuild the page from all snapshots
        run: python3 rw-data/build.py
      - name: Commit and push if anything changed
        run: |
          git config user.name  "Chun Cai"
          git config user.email "caichun@buaa.edu.cn"
          git add rw-data/snapshots public/index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "snapshot $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') CST"
            git push
          fi
